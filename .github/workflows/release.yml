name: Publish to PyPI

on:
  # One-time, commit-message-gated publication of v0.2.0.
  push:
    branches: [main]
    paths: [".github/workflows/release.yml"]
  # Normal publication method for future versions.
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'push' &&
       github.event.head_commit.message == 'release: publish boxtrail 0.2.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and build tool
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publisher)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create v0.2.0 GitHub Release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create annotated GitHub release with tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "BoxTrail 0.2.0"             --generate-notes
