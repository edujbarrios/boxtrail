name: Publish to PyPI

on:
  # The initial release is intentionally restricted to the exact commit message
  # below; all other pushes skip publishing. Future releases use GitHub Releases.
  push:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    # Restrict the initial publication to this one deliberate main push.
    if: >-
      github.event_name != 'push' ||
      github.event.head_commit.message == 'release: publish boxtrail 0.1.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and build tool
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions (PyPI trusted publisher)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
