name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }} (NumPy ${{ matrix.numpy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy: false
          - python: "3.11"
            numpy: true
          - python: "3.12"
            numpy: false
          - python: "3.13"
            numpy: false
          - python: "3.14"
            numpy: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Install optional NumPy (interop test)
        if: matrix.numpy
        run: python -m pip install numpy
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
