[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boxtrail"
version = "0.1.0"
description = "Tiny, inspectable, dependency-free letterbox bounding-box coordinate transforms"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Eduardo J. Barrios" }]
keywords = ["computer-vision", "bounding-box", "letterbox", "coordinates", "geometry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/edujbarrios/boxtrail"
Repository = "https://github.com/edujbarrios/boxtrail"
Issues = "https://github.com/edujbarrios/boxtrail/issues"

[tool.setuptools.packages.find]
where = ["src"]
